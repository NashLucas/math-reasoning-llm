# Generation and decoding presets for model inference and evaluation

# Global defaults derived from EDA token budgeting (reports/eda_summary.json)
default_max_new_tokens: 512
stop_sequences:
  - "Question:"
  - "\n\n\n"

presets:
  greedy:
    description: "Deterministic greedy decoding for exact evaluation and reproducibility"
    temperature: 0.0
    top_p: 1.0
    top_k: -1
    do_sample: false
    max_new_tokens: 512
    num_return_sequences: 1

  sampled:
    description: "Standard stochastic decoding for exploratory sampling"
    temperature: 0.7
    top_p: 0.95
    top_k: -1  # plan: temperature 0.7, top-p 0.95, no top-k
    do_sample: true
    max_new_tokens: 512
    num_return_sequences: 1

  self_consistency:
    description: "Self-consistency majority voting across diverse reasoning traces (Phase 2 & 7)"
    temperature: 0.7
    top_p: 0.95
    top_k: -1  # plan: temperature 0.7, top-p 0.95, no top-k
    do_sample: true
    max_new_tokens: 512
    num_samples: 8
    aggregation: "majority_vote"

  synthetic_generation:
    description: "Diverse candidate generation for Phase 3 reasoning traces (matches sampled preset)"
    temperature: 0.7
    top_p: 0.95
    top_k: -1
    do_sample: true
    max_new_tokens: 512
    num_samples: 4

batch_sizes:
  # Prompts per vLLM call. vLLM schedules its own batches, so give it many prompts at once;
  # each chunk is saved before the next starts (resume granularity).
  vllm: 128
  transformers_local: 4
  colab_g4: 8
