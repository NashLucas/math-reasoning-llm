name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'phase-*'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'  # matches the Colab runtime (verified 2026-11-01)
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c requirements.txt pyyaml pandas datasets transformers

      - name: Run Ruff Linting
        run: |
          ruff check src/ tests/ scripts/

      - name: Run Test Suite
        run: |
          python -m pytest tests/ -v
